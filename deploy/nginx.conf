# ZoloFund — Nginx reverse proxy (INFRA-02).
#
# Path: /etc/nginx/sites-available/loantrack.conf
# Symlink: ln -s /etc/nginx/sites-available/loantrack.conf \
#                /etc/nginx/sites-enabled/loantrack.conf
#
# Replace YOUR_DOMAIN with your actual root domain.
# SSL certs from certbot: certbot --nginx -d YOUR_DOMAIN -d *.YOUR_DOMAIN
#
# After every edit:  nginx -t && systemctl reload nginx

# ── HTTP → HTTPS redirect ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN *.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS app ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN *.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # SEC-06 belt-and-braces (also set by next.config.ts).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # PERF-06: gzip compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript application/json application/xml
        text/css text/javascript text/plain text/xml image/svg+xml;

    client_max_body_size 5M;       # cap uploads (matches /api/v1/upload limit)
    client_body_timeout 60s;

    # PERF-08: serve Next static directly, bypass Node.
    location /_next/static/ {
        alias /home/loantrack/app/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Next serves files from public/ at the ROOT path (/fonts/x.woff2, not
    # /public/fonts/x.woff2), so a "/public/" location never matches anything.
    # Serve them straight from disk with long cache instead of through Node.
    location /fonts/ {
        alias /home/loantrack/app/public/fonts/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /home/loantrack/app/public/assets/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SEC-08 helper: edge rate limit on auth endpoints (defense in depth).
    location ~ ^/api/(auth|v1/auth) {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/loantrack-proxy.inc;
    }

    # Everything else → PM2 cluster on :3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/loantrack-proxy.inc;
    }
}

# Save the proxy headers separately so both locations share them:
#   /etc/nginx/loantrack-proxy.inc
