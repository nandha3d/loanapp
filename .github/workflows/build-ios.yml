name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the build"
        required: true
        default: "http://187.127.177.121/api/v1"
  push:
    branches: [merged-all-branches]
    paths:
      - "mobile/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    # macOS runner is required for any iOS build. NOTE: on private repos macOS
    # minutes bill at 10x the Linux rate.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      # Unsigned release build. Produces build/ios/iphoneos/Runner.app.
      # This is NOT installable on a physical device without code signing —
      # see the repo README / workflow notes for adding Apple signing secrets.
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://187.127.177.121/api/v1' }}

      # Wrap the unsigned .app in the .ipa Payload layout so it can be archived
      # and later re-signed. A stock iPhone will still refuse to install it.
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr loantrack-unsigned.ipa Payload
          ls -lh loantrack-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: loantrack-unsigned-ipa
          path: mobile/build/ios/iphoneos/loantrack-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
