name: Export encrypted production database snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vps-readonly-snapshot
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stream read-only database snapshot from VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          port="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          ssh -4 -i "$key_file" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" 'cd /home/loantrack/app && node -' \
            < scripts/export-db-readonly.cjs \
            | gzip -1 \
            | node scripts/snapshot-crypto.mjs encrypt \
                deploy/production-snapshot-public.key \
                "$RUNNER_TEMP/production-snapshot.sql.gz.enc"

      - name: Upload encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: production-database-encrypted
          path: ${{ runner.temp }}/production-snapshot.sql.gz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
