name: VPS Update Environment Variables & Restart

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'update_smtp'
        type: choice
        options:
          - update_smtp
          - print_env_keys

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS, update .env, and redeploy
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -4 -T 20 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS=(
            -4 -i ~/.ssh/id_ed25519 -p "$VPS_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20 -o TCPKeepAlive=yes
          )
          REMOTE="$VPS_USER@$VPS_HOST"
          APP_DIR=/home/loantrack/app

          echo "Connecting to $REMOTE..."
          ssh "${SSH_OPTS[@]}" "$REMOTE" 'bash -s' <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd /home/loantrack/app

            echo "Ensuring backup of .env exists..."
            cp -n .env .env.backup.$(date +%Y%m%d%H%M%S) || true

            echo "Updating SMTP credentials in /home/loantrack/app/.env..."
            # Remove any existing SMTP keys
            sed -i '/^SMTP_/d' .env

            # Append the official MilesWeb SMTP settings
            printf '%s\n' \
              'SMTP_HOST="mail.zolofunds.com"' \
              'SMTP_PORT="465"' \
              'SMTP_USER="noreply@zolofunds.com"' \
              'SMTP_PASS="Animazon@Erode11"' \
              'SMTP_FROM="noreply@zolofunds.com"' \
              'SMTP_FROM_NAME="Zolo Funds"' \
              'SMTP_SECURE="true"' \
              'SMTP_TLS_REJECT_UNAUTHORIZED="false"' >> .env

            echo "Verified updated SMTP entries in .env:"
            grep '^SMTP_' .env | sed 's/SMTP_PASS=.*/SMTP_PASS=******/'

            echo "Triggering deploy.sh to apply changes..."
            bash /home/loantrack/app/deploy.sh
          REMOTE_SCRIPT

          echo "VPS .env updated and application restarted successfully!"
