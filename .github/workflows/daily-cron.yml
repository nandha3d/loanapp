name: Daily Penalty Accrual

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = midnight IST
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  accrue:
    runs-on: ubuntu-latest
    steps:
      - name: Call penalty accrual endpoint
        run: |
          curl -f -X GET \
            "${{ secrets.APP_URL }}/api/cron/accrue-penalties" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Purge expired GPS pings
        if: always()   # independent of accrual result
        run: |
          curl -f -X GET \
            "${{ secrets.APP_URL }}/api/cron/gps-purge" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
