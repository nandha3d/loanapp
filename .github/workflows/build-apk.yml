name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK"
        required: true
        default: "http://187.127.177.121/api/v1"
  push:
    branches: [merged-all-branches]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://187.127.177.121/api/v1' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loantrack-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
