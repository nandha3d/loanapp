name: VPS diagnose photos

# Read-only diagnostic: checks whether customer photo files exist on the VPS
# disk, what URLs are stored in the DB, and how /api/files responds locally.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and inspect photo pipeline
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          cd /home/loantrack/app
          echo "=== deployed code ==="
          git log --oneline -1
          echo
          echo "=== uploads directory ==="
          UP=$(grep -E '^UPLOAD_DIR=' .env | cut -d= -f2- || true)
          UP=${UP:-private/uploads}
          echo "upload dir: $UP"
          if [ -d "$UP" ]; then
            find "$UP" -type f | wc -l | xargs echo "total files:"
            find "$UP" -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -10 | cut -d' ' -f2-
          else
            echo "$UP DOES NOT EXIST"
          fi
          echo
          echo "=== DB photo URLs vs files on disk ==="
          cat > diag-photos.cjs <<'EOF'
          const { PrismaClient } = require('@prisma/client');
          const fs = require('fs');
          const path = require('path');
          const p = new PrismaClient();
          (async () => {
            const rows = await p.customer.findMany({
              select: { customerCode: true, tenantId: true, profilePhoto: true },
              orderBy: { createdAt: 'desc' },
              take: 20,
            });
            for (const r of rows) {
              let status = 'no photo set';
              if (r.profilePhoto) {
                const m = r.profilePhoto.match(/^\/api\/files\/(.+)$/);
                if (m) {
                  const base = process.env.UPLOAD_DIR || path.join(process.cwd(), 'private', 'uploads');
                  const f = path.join(base, ...m[1].split('/'));
                  status = fs.existsSync(f) ? 'FILE OK  ' + r.profilePhoto : 'FILE MISSING  ' + r.profilePhoto;
                } else {
                  status = 'UNEXPECTED URL FORMAT  ' + r.profilePhoto;
                }
              }
              console.log(r.customerCode, '| tenant', r.tenantId, '|', status);
            }
            await p.$disconnect();
          })().catch((e) => { console.error('ERR', e.message); process.exit(1); });
          EOF
          UPLOAD_DIR="$UP" node diag-photos.cjs
          rm -f diag-photos.cjs
          echo
          echo "=== overdue loan consistency check ==="
          cat > diag-loans.cjs <<'EOF2'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          const day = (d) => new Date(d).toISOString().slice(0, 10);
          (async () => {
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const loans = await p.loan.findMany({
              where: { status: { in: ['active', 'overdue'] } },
              select: {
                id: true, loanCode: true, status: true, totalCollected: true,
                instalments: { select: { status: true, dueAmount: true, receivedAmount: true, dueDate: true } },
              },
              take: 15,
            });
            for (const l of loans) {
              const past = l.instalments.filter((i) => new Date(i.dueDate) < today);
              const pastUnpaid = past.filter((i) => Number(i.receivedAmount) < Number(i.dueAmount));
              const sumReceived = l.instalments.reduce((s, i) => s + Number(i.receivedAmount), 0);
              const byStatus = {};
              for (const i of l.instalments) byStatus[i.status] = (byStatus[i.status] || 0) + 1;
              const overdueAmt = pastUnpaid.reduce((s, i) => s + (Number(i.dueAmount) - Number(i.receivedAmount)), 0);
              console.log(
                l.loanCode, '| loan.status:', l.status,
                '| totalCollected:', Number(l.totalCollected),
                '| sum(inst.received):', sumReceived,
                '| inst by status:', JSON.stringify(byStatus),
                '| past-due unpaid:', pastUnpaid.length, 'amt:', overdueAmt,
                pastUnpaid.length ? '| first unpaid due ' + day(pastUnpaid[0].dueDate) : '',
              );
              const pays = await p.payment.aggregate({ where: { loanId: l.id }, _sum: { amount: true }, _count: true }).catch(() => null);
              if (pays) console.log('   payments:', pays._count, 'sum:', Number(pays._sum.amount || 0));
            }
            await p.$disconnect();
          })().catch((e) => { console.error('ERR', e.message); process.exit(1); });
          EOF2
          node diag-loans.cjs
          rm -f diag-loans.cjs
          echo
          echo "=== local API responses ==="
          curl -s -o /dev/null -w "files route, no auth (expect 401): %{http_code}\n" http://127.0.0.1:3000/api/files/x/y.jpg
          curl -s -o /dev/null -w "files route, bad bearer (expect 401): %{http_code}\n" -H "Authorization: Bearer garbage" http://127.0.0.1:3000/api/files/x/y.jpg
          echo
          echo "=== pm2 ==="
          pm2 ls || true
          echo
          echo "=== network reachability (why the phone can't connect) ==="
          echo -n "server public IP: "; curl -s -m 10 https://api.ipify.org || curl -s -m 10 https://ifconfig.me || echo "unknown"
          echo
          echo "APK is baked to reach: 187.127.177.121"
          echo -n "node on :3000 (expect 401/200): "; curl -s -o /dev/null -w "%{http_code}\n" -m 8 http://127.0.0.1:3000/api/v1/pricing || echo "DOWN"
          echo -n "nginx :80 -> API (login path, expect 400/401/405): "; curl -s -o /dev/null -w "%{http_code}\n" -m 8 -X POST http://127.0.0.1/api/v1/auth/login || echo "DOWN"
          echo "listening sockets on :80 / :443 / :3000:"; (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':80 |:443 |:3000 ' || echo "  (none found)"
          echo "nginx service:"; systemctl is-active nginx 2>/dev/null || echo "  unknown"
          REMOTE
