name: VPS diagnose photos

# Export Samurai production data from VPS and package as artifact
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and export Samurai production data
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/loantrack/app
          cat > export_samurai.cjs <<'EOF'
          const { PrismaClient } = require('@prisma/client');
          const fs = require('fs');
          const p = new PrismaClient();

          async function main() {
            console.log('=== Locating Samurai Tenant ===');
            const tenant = await p.tenant.findFirst({
              where: {
                OR: [
                  { slug: 'samurai-ml-af-cf' },
                  { customDomain: 'loan.samuraibuiness.in' },
                  { name: { contains: 'Samurai' } },
                ],
              },
            });

            if (!tenant) {
              const allTenants = await p.tenant.findMany({ select: { id: true, name: true, slug: true, customDomain: true } });
              console.error('All tenants on VPS:', JSON.stringify(allTenants, null, 2));
              throw new Error('Tenant not found!');
            }

            console.log(`Exporting for tenant: ${tenant.name} (${tenant.id}), slug: ${tenant.slug}`);
            const tenantId = tenant.id;

            const [
              branches,
              users,
              superadminBranches,
              userBranchModules,
              routes,
              routeAgents,
              customers,
              loans,
              instalments,
              payments,
              penalties,
              collectionEntries,
              dailyCollections,
              approvalRequests,
              accountEntries,
              appSettings,
            ] = await Promise.all([
              p.branch.findMany({ where: { tenantId } }),
              p.user.findMany({ where: { tenantId } }),
              p.superadminBranch.findMany({ where: { branch: { tenantId } } }),
              p.userBranchModule.findMany({ where: { user: { tenantId } } }),
              p.route.findMany({ where: { tenantId } }),
              p.routeAgent.findMany({ where: { route: { tenantId } } }),
              p.customer.findMany({ where: { tenantId } }),
              p.loan.findMany({ where: { tenantId } }),
              p.instalment.findMany({ where: { loan: { tenantId } } }),
              p.payment.findMany({ where: { loan: { tenantId } } }),
              p.penalty.findMany({ where: { loan: { tenantId } } }),
              p.collectionEntry.findMany({ where: { tenantId } }),
              p.dailyCollection.findMany({ where: { tenantId } }),
              p.approvalRequest.findMany({ where: { tenantId } }),
              p.accountEntry.findMany({ where: { tenantId } }),
              p.appSetting.findMany({ where: { tenantId } }),
            ]);

            const loanStatusBreakdown = {};
            for (const l of loans) {
              loanStatusBreakdown[l.status] = (loanStatusBreakdown[l.status] || 0) + 1;
            }

            const userRoleBreakdown = {};
            for (const u of users) {
              userRoleBreakdown[u.role] = (userRoleBreakdown[u.role] || 0) + 1;
            }

            console.log('=== EXPORT SUMMARY ===');
            console.log(`Tenant: ${tenant.name} (${tenant.id})`);
            console.log(`Branches: ${branches.length}`);
            console.log(`Users: ${users.length}`, JSON.stringify(userRoleBreakdown));
            console.log(`Routes: ${routes.length}`);
            console.log(`Customers: ${customers.length}`);
            console.log(`Loans: ${loans.length}`, JSON.stringify(loanStatusBreakdown));
            console.log(`Instalments: ${instalments.length}`);
            console.log(`Payments: ${payments.length}`);
            console.log(`Penalties: ${penalties.length}`);
            console.log(`Collection Entries: ${collectionEntries.length}`);
            console.log(`Daily Collections: ${dailyCollections.length}`);
            console.log(`Approval Requests: ${approvalRequests.length}`);
            console.log(`Account Entries: ${accountEntries.length}`);
            console.log(`App Settings: ${appSettings.length}`);

            const payload = {
              exportedAt: new Date().toISOString(),
              tenant,
              branches,
              users,
              superadminBranches,
              userBranchModules,
              routes,
              routeAgents,
              customers,
              loans,
              instalments,
              payments,
              penalties,
              collectionEntries,
              dailyCollections,
              approvalRequests,
              accountEntries,
              appSettings,
            };

            fs.writeFileSync('samurai_production_export.json', JSON.stringify(payload, null, 2), 'utf8');
            console.log('Successfully wrote samurai_production_export.json');
          }

          main()
            .catch((e) => {
              console.error('Export failed:', e);
              process.exit(1);
            })
            .finally(() => p.$disconnect());
EOF
          node export_samurai.cjs
          rm -f export_samurai.cjs
REMOTE

      - name: Download export file from VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST:/home/loantrack/app/samurai_production_export.json" ./samurai_production_export.json
          
          # Clean up from VPS
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" "rm -f /home/loantrack/app/samurai_production_export.json"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: samurai-production-export
          path: samurai_production_export.json
