name: Deploy to VPS

on:
  push:
    branches: [merged-all-branches]
    # Mobile-only changes don't affect the server — skip the redeploy so a
    # Flutter tweak never restarts the API (and never opens a login-timeout
    # window). A push touching any non-mobile file still deploys.
    paths-ignore:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and run deploy.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Resolving VPS host"
          getent hosts "$VPS_HOST" || true

          echo "Checking SSH TCP reachability for $VPS_HOST:$VPS_PORT"
          nc -vz -w 20 "$VPS_HOST" "$VPS_PORT"

          echo "Adding VPS host key for $VPS_HOST:$VPS_PORT"
          if ssh-keyscan -4 -T 20 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
            echo "Host key added from ssh-keyscan"
          else
            echo "::warning::ssh-keyscan failed; ssh will use StrictHostKeyChecking=accept-new"
            cat ssh-keyscan.err
          fi

          echo "Running remote deploy preflight"
          ssh -4 -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             echo "connected: $(hostname) as $(whoami)"
             test -d /home/loantrack/app || { echo "missing /home/loantrack/app"; exit 20; }
             test -f /home/loantrack/app/deploy.sh || { echo "missing /home/loantrack/app/deploy.sh"; exit 21; }
             bash /home/loantrack/app/deploy.sh'
