name: Deploy to VPS

on:
  push:
    branches: [merged-all-branches]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and run deploy.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # 1. Validate secrets are populated
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY secret is not set or empty in GitHub."
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST secret is not set or empty in GitHub."
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "ERROR: VPS_USER secret is not set or empty in GitHub."
            exit 1
          fi
          if [ -z "$VPS_PORT" ]; then
            echo "WARNING: VPS_PORT secret is empty. Defaulting to 22."
            VPS_PORT=22
          fi

          # 2. Setup SSH directory and private key
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 3. Add host key to known_hosts (non-blocking fallback)
          echo "Adding host key for $VPS_HOST:$VPS_PORT to known_hosts..."
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts || {
            echo "WARNING: ssh-keyscan failed, but continuing since StrictHostKeyChecking is accept-new."
          }

          # 4. SSH and run deploy script
          echo "Connecting to $VPS_USER@$VPS_HOST:$VPS_PORT..."
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'bash /home/loantrack/app/deploy.sh'

