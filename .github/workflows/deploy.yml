name: Deploy to VPS

on:
  push:
    branches: [merged-all-branches]
    # Mobile-only changes don't affect the server — skip the redeploy so a
    # Flutter tweak never restarts the API (and never opens a login-timeout
    # window). A push touching any non-mobile file still deploys.
    paths-ignore:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and run deploy.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Resolving VPS host"
          getent hosts "$VPS_HOST" || true

          echo "Checking SSH TCP reachability for $VPS_HOST:$VPS_PORT"
          nc -vz -w 20 "$VPS_HOST" "$VPS_PORT"

          echo "Adding VPS host key for $VPS_HOST:$VPS_PORT"
          if ssh-keyscan -4 -T 20 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
            echo "Host key added from ssh-keyscan"
          else
            echo "::warning::ssh-keyscan failed; ssh will use StrictHostKeyChecking=accept-new"
            cat ssh-keyscan.err
          fi

          # `npm install` inside deploy.sh runs silently for minutes at a time. With
          # no keepalive the channel idles out, and the resulting broken pipe used to
          # SIGHUP deploy.sh mid-install — leaving the VPS with new code checked out
          # but stale dependencies and no restart.
          SSH_OPTS=(
            -4 -i ~/.ssh/id_ed25519 -p "$VPS_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20 -o TCPKeepAlive=yes
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40
          )
          REMOTE="$VPS_USER@$VPS_HOST"
          APP_DIR=/home/loantrack/app

          echo "Running remote deploy preflight"
          # setsid+nohup detaches deploy.sh from this SSH session, so even if the
          # connection still drops the deploy runs to completion; the exit code lands
          # in a status file that the poll loop below reads back.
          ssh "${SSH_OPTS[@]}" "$REMOTE" "
            set -euo pipefail
            echo \"connected: \$(hostname) as \$(whoami)\"
            test -d $APP_DIR || { echo 'missing $APP_DIR'; exit 20; }
            test -f $APP_DIR/deploy.sh || { echo 'missing $APP_DIR/deploy.sh'; exit 21; }
            rm -f /tmp/deploy.log /tmp/deploy.status
            setsid nohup bash -c 'bash $APP_DIR/deploy.sh > /tmp/deploy.log 2>&1; echo \$? > /tmp/deploy.status' >/dev/null 2>&1 &
            echo 'deploy started detached'
          "

          echo "Waiting for the remote deploy to finish"
          status=""
          for _ in $(seq 1 80); do   # 80 x 15s = 20 min ceiling
            sleep 15
            status="$(ssh "${SSH_OPTS[@]}" "$REMOTE" 'cat /tmp/deploy.status 2>/dev/null || true' || true)"
            [ -n "$status" ] && break
            echo "  ... still deploying"
          done

          echo "===== remote deploy log ====="
          ssh "${SSH_OPTS[@]}" "$REMOTE" 'cat /tmp/deploy.log 2>/dev/null || echo "(no log)"' || true
          echo "============================="

          if [ -z "$status" ]; then
            echo "::error::Deploy did not finish within 20 minutes."
            exit 1
          fi
          if [ "$status" != "0" ]; then
            echo "::error::deploy.sh exited with status $status"
            exit "$status"
          fi
          echo "Deploy completed successfully."
