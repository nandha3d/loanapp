name: VPS reallocate loan repayments

# One-time data repair: re-runs oldest-first payment allocation on every open
# loan so loans list / detail / calendar / overdues / penalties / dashboard
# all show the same overdue picture. Safe to re-run (idempotent).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  reallocate:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and reallocate
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /home/loantrack/app
          echo "[reallocate] running oldest-first reallocation on all open loans"
          npx tsx scripts/reallocate-all-loans.ts
          REMOTE
