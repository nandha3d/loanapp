name: loantrack
description: LoanTrack — microlending & chit fund mobile app for field agents and admins.
publish_to: 'none'
version: 0.1.0+17

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0
  http_parser: ^4.0.2

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # NOTE: isar/isar_flutter_libs removed — they were never used in Dart (the
  # offline queue uses Hive), but isar_flutter_libs auto-registered a native
  # plugin that loaded broken native code at startup (crashing the app before
  # the UI rendered) and forced fragile AGP-9 build patches in CI.
  path_provider: ^2.1.5
  crypto: ^3.0.3

  # Connectivity & auth
  connectivity_plus: ^6.1.0
  local_auth: ^2.3.0

  # GPS (GPS-04)
  geolocator: ^13.0.0
  permission_handler: ^11.3.0

  # Google sign-in (registration/login)
  google_sign_in: ^6.2.1

  # QR scanner (payment proof)
  mobile_scanner: ^5.2.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Charts / media
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.3.7

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Accessibility - true TTS for low-literacy voice guidance (U2)
  flutter_tts: ^4.2.0

  # Voice ENTRY - speech-to-text collection input (parity: Vasool voice entry)
  speech_to_text: ^7.0.0

  # Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
