<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanTrack — Login</title>
  <meta name="description" content="LoanTrack Micro-Lending Manager — Login">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo.svg">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo.svg" alt="LoanTrack">
      <h1>Loan<span>Track</span></h1>
    </div>
    <p style="text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:28px;">Micro-Lending Management System</p>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">Username / Phone</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username or phone" value="admin" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" value="admin123" required>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <label class="checkbox-label"><input type="checkbox" checked> Remember me</label>
        <a href="#" style="font-size:.8rem;" onclick="alert('Password reset link sent!')">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:.95rem;">
        <span class="material-icons-outlined" style="font-size:18px">login</span> Sign In
      </button>
    </form>
    <div style="margin-top:24px;text-align:center;">
      <p style="font-size:.78rem;color:var(--text-light);margin-bottom:10px;">Demo Login Credentials</p>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button class="btn btn-secondary btn-sm" onclick="setRole('admin')">
          <span class="material-icons-outlined" style="font-size:14px">admin_panel_settings</span> Admin
        </button>
        <button class="btn btn-secondary btn-sm" onclick="setRole('agent')">
          <span class="material-icons-outlined" style="font-size:14px">person</span> Agent
        </button>
      </div>
    </div>
  </div>
</div>
<script>
function setRole(role) {
  document.getElementById('username').value = role === 'admin' ? 'admin' : 'karthik';
  document.getElementById('password').value = role === 'admin' ? 'admin123' : 'agent123';
}
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const role = (u === 'admin') ? 'admin' : 'agent';
  localStorage.setItem('lt_role', role);
  localStorage.setItem('lt_user', u);
  window.location.href = role === 'admin' ? 'pages/dashboard.html' : 'pages/collection.html';
  return false;
}
</script>
</body>
</html>
