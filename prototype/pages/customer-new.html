<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Customer — LoanTrack</title>
  <link rel="stylesheet" href="../css/styles.css"><link rel="icon" href="../assets/logo.svg">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-up">
      <div class="card" style="max-width:800px">
        <div class="card-header"><h3 id="formTitle">➕ Register New Customer</h3></div>
        <form onsubmit="return handleSubmit(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" class="form-control" id="phone" placeholder="Enter 10-digit phone" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Address *</label>
            <textarea class="form-control" id="address" placeholder="Full address..." required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Route / Line *</label>
              <select class="form-control" id="route" required>
                <option value="">Select Route</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Assigned Agent *</label>
              <select class="form-control" id="agent" required>
                <option value="">Select Agent</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Aadhar Card Upload</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('aadharFile').click()">
              <span class="material-icons-outlined">cloud_upload</span>
              <p>Drag & drop Aadhar image or <strong>click to browse</strong></p>
              <p style="font-size:.72rem;color:var(--text-light)">JPG, PNG up to 5MB</p>
            </div>
            <input type="file" id="aadharFile" accept="image/*" style="display:none" onchange="handleFileUpload(this)">
          </div>

          <h4 style="margin:24px 0 12px;font-size:.9rem">Security Cheques (up to 5)</h4>
          <div id="chequeEntries"></div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="addChequeRow()" style="margin-top:8px">
            <span class="material-icons-outlined" style="font-size:14px">add</span> Add Cheque
          </button>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><span class="material-icons-outlined" style="font-size:16px">save</span> Submit</button>
            <button type="button" class="btn btn-secondary" onclick="alert('Draft saved!')"><span class="material-icons-outlined" style="font-size:16px">drafts</span> Save Draft</button>
            <a href="customers.html" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
<script>
const editId = getUrlParam('edit');
initPage('customers', editId ? 'Edit Customer' : 'New Customer', [{label:'Dashboard',href:'dashboard.html'},{label:'Customers',href:'customers.html'},{label: editId ? 'Edit' : 'New'}]);

// Populate dropdowns
const routeSel = document.getElementById('route');
MOCK.routes.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; routeSel.appendChild(o); });
const agentSel = document.getElementById('agent');
MOCK.agents.forEach(a => { const o = document.createElement('option'); o.value = a.id; o.textContent = `${a.name} (${a.route})`; agentSel.appendChild(o); });

// Cheque rows
let chequeCount = 0;
function addChequeRow() {
  if (chequeCount >= 5) { alert('Maximum 5 cheques allowed'); return; }
  chequeCount++;
  const div = document.getElementById('chequeEntries');
  const row = document.createElement('div');
  row.className = 'cheque-row';
  row.innerHTML = `<div class="num">${chequeCount}</div><input type="text" class="form-control" placeholder="Bank Name"><input type="text" class="form-control" placeholder="Cheque Number"><button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove();chequeCount--" style="color:var(--danger)"><span class="material-icons-outlined" style="font-size:16px">delete</span></button>`;
  div.appendChild(row);
}
addChequeRow(); addChequeRow(); // Start with 2 rows

// File upload visual
function handleFileUpload(input) {
  if (input.files.length) {
    document.getElementById('uploadZone').innerHTML = `<span class="material-icons-outlined" style="color:var(--success)">check_circle</span><p><strong>${input.files[0].name}</strong> uploaded</p>`;
  }
}

// Edit mode populate
if (editId) {
  const c = getCustomer(editId);
  if (c) {
    document.getElementById('formTitle').textContent = '✏️ Edit Customer — ' + c.name;
    document.getElementById('fullName').value = c.name;
    document.getElementById('phone').value = c.phone;
    document.getElementById('address').value = c.address;
    document.getElementById('route').value = c.route;
    document.getElementById('agent').value = c.agent;
  }
}

function handleSubmit(e) {
  e.preventDefault();
  alert(editId ? 'Customer updated successfully!' : 'New customer registered successfully!');
  window.location.href = 'customers.html';
  return false;
}
</script>
</body>
</html>
