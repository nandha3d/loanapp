<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — LoanTrack</title>
  <link rel="stylesheet" href="../css/styles.css"><link rel="icon" href="../assets/logo.svg">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-up">
      <div class="card">
        <div class="card-header">
          <h3>Customer Directory</h3>
          <a href="customer-new.html" class="btn btn-primary btn-sm"><span class="material-icons-outlined" style="font-size:16px">add</span> New Customer</a>
        </div>
        <div class="filter-bar">
          <div class="search-input">
            <span class="material-icons-outlined">search</span>
            <input type="text" class="form-control" placeholder="Search by name, ID, or phone..." id="searchInput" oninput="filterCustomers()">
          </div>
          <select class="form-control" id="filterRoute" onchange="filterCustomers()" style="width:auto">
            <option value="">All Routes</option>
          </select>
          <select class="form-control" id="filterStatus" onchange="filterCustomers()" style="width:auto">
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Overdue">Overdue</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Customer ID</th><th>Name</th><th>Phone</th><th>Route</th><th>Active Loan</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="customerTable"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 1–8 of 8 customers</span>
          <div class="pages">
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">›</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
<script>
initPage('customers', 'Customers', [{label:'Dashboard',href:'dashboard.html'},{label:'Customers'}]);

// Populate route filter
const routeSel = document.getElementById('filterRoute');
MOCK.routes.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; routeSel.appendChild(o); });

function filterCustomers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const route = document.getElementById('filterRoute').value;
  const status = document.getElementById('filterStatus').value;
  const filtered = MOCK.customers.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !c.id.toLowerCase().includes(q) && !c.phone.includes(q)) return false;
    if (route && c.route !== route) return false;
    if (status && c.status !== status) return false;
    return true;
  });
  renderCustomers(filtered);
}

function renderCustomers(list) {
  const loans = MOCK.loans;
  document.getElementById('customerTable').innerHTML = list.map(c => {
    const loan = loans.find(l => l.customerId === c.id && l.status !== 'Closed');
    return `<tr>
      <td><strong>${c.id}</strong></td>
      <td>${c.name}</td>
      <td>${c.phone}</td>
      <td>${c.route}</td>
      <td>${loan ? `<a href="loan-detail.html?id=${loan.id}">${loan.id}</a> — ${fmt(loan.principal)}` : '<span style="color:var(--text-light)">None</span>'}</td>
      <td><span class="${badgeClass(c.status)}">${c.status}</span></td>
      <td>
        <a href="customer-profile.html?id=${c.id}" class="btn btn-ghost btn-sm">View</a>
        <a href="customer-new.html?edit=${c.id}" class="btn btn-ghost btn-sm">Edit</a>
      </td>
    </tr>`;
  }).join('');
}

filterCustomers();
// Auto-filter from URL
const urlFilter = getUrlParam('filter');
if (urlFilter) { document.getElementById('filterStatus').value = urlFilter.charAt(0).toUpperCase() + urlFilter.slice(1); filterCustomers(); }
</script>
</body>
</html>
