<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans — LoanTrack</title>
  <link rel="stylesheet" href="../css/styles.css"><link rel="icon" href="../assets/logo.svg">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-up">
      <div class="card">
        <div class="card-header">
          <h3>Loan Portfolio</h3>
          <a href="loan-new.html" class="btn btn-primary btn-sm"><span class="material-icons-outlined" style="font-size:16px">add</span> New Loan</a>
        </div>
        <div class="filter-bar">
          <div class="search-input">
            <span class="material-icons-outlined">search</span>
            <input type="text" class="form-control" placeholder="Search loan ID or customer..." id="searchInput" oninput="filterLoans()">
          </div>
          <select class="form-control" id="filterStatus" onchange="filterLoans()" style="width:auto">
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Overdue">Overdue</option>
            <option value="Closed">Closed</option>
          </select>
          <select class="form-control" id="filterFreq" onchange="filterLoans()" style="width:auto">
            <option value="">All Frequency</option>
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
          <select class="form-control" id="filterRoute" onchange="filterLoans()" style="width:auto">
            <option value="">All Routes</option>
          </select>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Loan ID</th><th>Customer</th><th>Principal</th><th>Disbursed</th><th>Start Date</th><th>Frequency</th><th>Progress</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="loanTable"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="paginationInfo">Showing loans</span>
          <div class="pages">
            <button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
<script>
initPage('loans', 'Loans', [{label:'Dashboard',href:'dashboard.html'},{label:'Loans'}]);
const routeSel = document.getElementById('filterRoute');
MOCK.routes.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; routeSel.appendChild(o); });

function filterLoans() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const freq = document.getElementById('filterFreq').value;
  const route = document.getElementById('filterRoute').value;
  const filtered = MOCK.loans.filter(l => {
    const c = getCustomer(l.customerId);
    if (q && !l.id.toLowerCase().includes(q) && !(c && c.name.toLowerCase().includes(q))) return false;
    if (status && l.status !== status) return false;
    if (freq && l.frequency !== freq) return false;
    if (route && c && c.route !== route) return false;
    return true;
  });
  renderLoans(filtered);
}

function renderLoans(list) {
  document.getElementById('loanTable').innerHTML = list.map(l => {
    const c = getCustomer(l.customerId);
    const pct = Math.round(l.paidCount / l.totalInstalments * 100);
    const endDate = new Date(l.startDate);
    if (l.frequency === 'Daily') endDate.setDate(endDate.getDate() + l.tenure);
    else if (l.frequency === 'Weekly') endDate.setDate(endDate.getDate() + l.tenure * 7);
    else endDate.setMonth(endDate.getMonth() + l.tenure);
    return `<tr>
      <td><a href="loan-detail.html?id=${l.id}"><strong>${l.id}</strong></a></td>
      <td>${c ? `<a href="customer-profile.html?id=${c.id}">${c.name}</a>` : 'Unknown'}</td>
      <td>${fmt(l.principal)}</td><td>${fmt(l.disbursed)}</td>
      <td>${fmtDate(l.startDate)}</td><td>${l.frequency}</td>
      <td style="min-width:120px"><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-text">${pct}% (${l.paidCount}/${l.totalInstalments})</span></td>
      <td><span class="${badgeClass(l.status)}">${l.status}</span></td>
      <td><a href="loan-detail.html?id=${l.id}" class="btn btn-ghost btn-sm">View</a></td>
    </tr>`;
  }).join('');
  document.getElementById('paginationInfo').textContent = `Showing 1–${list.length} of ${list.length} loans`;
}
filterLoans();
</script>
</body>
</html>
