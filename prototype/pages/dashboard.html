<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — LoanTrack</title>
  <link rel="stylesheet" href="../css/styles.css"><link rel="icon" href="../assets/logo.svg">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-up">
      <!-- KPI Row 1 -->
      <div class="kpi-grid" id="kpiRow1"></div>
      <!-- KPI Row 2 -->
      <div class="kpi-grid" id="kpiRow2"></div>

      <div class="grid-60-40">
        <!-- Defaulter Alert -->
        <div class="card">
          <div class="card-header">
            <h3>⚠️ Defaulter Alerts</h3>
            <a href="customers.html?filter=overdue" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div class="table-wrapper">
            <table><thead><tr><th>Customer</th><th>Route</th><th>Days Missed</th><th>Penalty</th><th>Last Payment</th><th>Action</th></tr></thead>
            <tbody id="defaulterTable"></tbody></table>
          </div>
        </div>

        <!-- Route Performance -->
        <div class="card">
          <div class="card-header"><h3>📊 Route Performance</h3></div>
          <div class="table-wrapper">
            <table><thead><tr><th>Route</th><th>Expected</th><th>Collected</th><th>Gap</th><th>%</th></tr></thead>
            <tbody>
              <tr><td>Erode</td><td>₹12,600</td><td>₹9,450</td><td style="color:var(--danger)">₹3,150</td><td><div class="progress" style="width:80px"><div class="progress-fill" style="width:75%"></div></div><span class="progress-text">75%</span></td></tr>
              <tr><td>Chithode</td><td>₹9,000</td><td>₹8,100</td><td style="color:var(--danger)">₹900</td><td><div class="progress" style="width:80px"><div class="progress-fill" style="width:90%"></div></div><span class="progress-text">90%</span></td></tr>
              <tr><td>Gobichettipalayam</td><td>₹3,500</td><td>₹3,500</td><td style="color:var(--success)">₹0</td><td><div class="progress" style="width:80px"><div class="progress-fill" style="width:100%;background:var(--success)"></div></div><span class="progress-text">100%</span></td></tr>
              <tr><td>Bhavani</td><td>₹3,500</td><td>₹2,800</td><td style="color:var(--danger)">₹700</td><td><div class="progress" style="width:80px"><div class="progress-fill" style="width:80%"></div></div><span class="progress-text">80%</span></td></tr>
            </tbody></table>
          </div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="card" style="margin-top:20px">
        <div class="card-header"><h3>🕐 Recent Activity</h3></div>
        <div id="activityFeed"></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
<script>
initPage('dashboard', 'Dashboard');

// KPI Row 1
document.getElementById('kpiRow1').innerHTML = [
  { icon: 'trending_up', cls: 'green', value: fmt(28600), label: "Today's Expected Collection" },
  { icon: 'account_balance_wallet', cls: 'orange', value: fmt(23850), label: "Today's Actual Collected" },
  { icon: 'trending_down', cls: 'red', value: fmt(4750), label: 'Collection Gap' },
  { icon: 'credit_card', cls: 'blue', value: '42', label: 'Total Active Loans' },
].map(k => `<div class="kpi-card"><div class="kpi-icon ${k.cls}"><span class="material-icons-outlined">${k.icon}</span></div><div><div class="kpi-value">${k.value}</div><div class="kpi-label">${k.label}</div></div></div>`).join('');

// KPI Row 2
document.getElementById('kpiRow2').innerHTML = [
  { icon: 'warning', cls: 'red', value: '5', label: 'Total Defaulters Today' },
  { icon: 'gavel', cls: 'purple', value: fmt(12400), label: 'Total Penalty Accumulated' },
  { icon: 'event', cls: 'blue', value: '3', label: 'Loans Closing This Week' },
  { icon: 'add_circle', cls: 'green', value: '8', label: 'New Loans This Month' },
].map(k => `<div class="kpi-card"><div class="kpi-icon ${k.cls}"><span class="material-icons-outlined">${k.icon}</span></div><div><div class="kpi-value">${k.value}</div><div class="kpi-label">${k.label}</div></div></div>`).join('');

// Defaulter table
const defaulters = [
  { cust: 'CUS003', name: 'Anand Babu', route: 'Erode', missed: 8, penalty: 1600, lastPay: '2025-04-20' },
  { cust: 'CUS007', name: 'Govindaraj M.', route: 'Erode', missed: 5, penalty: 300, lastPay: '2025-04-23' },
  { cust: 'CUS002', name: 'Lakshmi Devi', route: 'Chithode', missed: 2, penalty: 200, lastPay: '2025-04-26' },
];
document.getElementById('defaulterTable').innerHTML = defaulters.map(d => `<tr>
  <td><strong>${d.name}</strong><br><span style="font-size:.72rem;color:var(--text-light)">${d.cust}</span></td>
  <td>${d.route}</td>
  <td><span class="badge badge-missed">${d.missed} days</span></td>
  <td style="color:var(--danger);font-weight:600">${fmt(d.penalty)}</td>
  <td>${fmtDate(d.lastPay)}</td>
  <td><a href="customer-profile.html?id=${d.cust}" class="btn btn-ghost btn-sm">View</a></td>
</tr>`).join('');

// Activity feed
document.getElementById('activityFeed').innerHTML = MOCK.activities.map(a => `<div class="activity-item">
  <div class="activity-dot"></div>
  <div style="flex:1"><div class="activity-text"><strong>${a.agent}</strong> — ${a.customerId} — ${a.action}</div><div class="activity-time">${a.time}</div></div>
</div>`).join('');
</script>
</body>
</html>
