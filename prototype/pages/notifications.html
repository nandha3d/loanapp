<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — LoanTrack</title>
  <link rel="stylesheet" href="../css/styles.css"><link rel="icon" href="../assets/logo.svg">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-up">
      <div class="card">
        <div class="card-header">
          <h3>🔔 Notifications</h3>
          <button class="btn btn-ghost btn-sm" onclick="markAllRead()"><span class="material-icons-outlined" style="font-size:14px">done_all</span> Mark All Read</button>
        </div>
        <div class="filter-bar">
          <button class="btn btn-primary btn-sm filter-btn active-filter" onclick="filterNotif('all',this)">All</button>
          <button class="btn btn-secondary btn-sm filter-btn" onclick="filterNotif('warning',this)">⚠️ Warnings</button>
          <button class="btn btn-secondary btn-sm filter-btn" onclick="filterNotif('danger',this)">🔴 Critical</button>
          <button class="btn btn-secondary btn-sm filter-btn" onclick="filterNotif('info',this)">ℹ️ Info</button>
          <button class="btn btn-secondary btn-sm filter-btn" onclick="filterNotif('success',this)">✅ Success</button>
        </div>
        <div id="notifList"></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
<script>
initPage('notifications-page', 'Notifications', [{label:'Dashboard',href:'dashboard.html'},{label:'Notifications'}]);

const allNotifs = [
  { type: 'warning', icon: 'warning', color: '#F59E0B', title: 'Loan LN003 Overdue', text: 'Customer Anand Babu has missed 8 consecutive payments. Total penalty: ₹1,600.', time: '10 minutes ago', unread: true },
  { type: 'info', icon: 'event', color: '#3B82F6', title: 'Loan Closing Today', text: 'Loan LN005 for Suresh Pandi is scheduled to close today after final instalment.', time: '30 minutes ago', unread: true },
  { type: 'danger', icon: 'error', color: '#EF4444', title: 'High Defaulter Count', text: '3 defaulters detected on Erode route today. Immediate attention required.', time: '1 hour ago', unread: true },
  { type: 'info', icon: 'person', color: '#3B82F6', title: 'Agent Collection Pending', text: 'Agent Karthik Rajan has not submitted today\'s collections yet.', time: '2 hours ago', unread: false },
  { type: 'success', icon: 'check_circle', color: '#22C55E', title: 'Penalty Waived', text: 'Penalty of ₹500 waived for customer CUS004 (Meena Kumari) by Admin.', time: '3 hours ago', unread: false },
  { type: 'info', icon: 'add_circle', color: '#3B82F6', title: 'New Loan Created', text: 'Loan LN006 created for Kavitha Selvi — Principal ₹35,000 (Daily, 100 days).', time: '5 hours ago', unread: false },
  { type: 'warning', icon: 'warning', color: '#F59E0B', title: 'Penalty Threshold Breach', text: 'Loan LN003 penalty has exceeded ₹1,500 threshold.', time: 'Yesterday', unread: false },
  { type: 'success', icon: 'payments', color: '#22C55E', title: 'Bulk Collection Submitted', text: 'Agent Senthil Kumar submitted all 8 collections for Chithode route.', time: 'Yesterday', unread: false },
  { type: 'danger', icon: 'report', color: '#EF4444', title: 'Cheque Returned', text: 'Security cheque IOB-123456 for customer Anand Babu was returned by bank.', time: '2 days ago', unread: false },
  { type: 'info', icon: 'person_add', color: '#3B82F6', title: 'New Customer Registered', text: 'Customer Priya Nandini (CUS008) registered by Karthik Rajan on Erode route.', time: '3 days ago', unread: false },
];

function renderNotifs(filter) {
  const list = filter === 'all' ? allNotifs : allNotifs.filter(n => n.type === filter);
  document.getElementById('notifList').innerHTML = list.map(n => `
    <div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);${n.unread ? 'background:var(--primary-light);margin:0 -24px;padding-left:24px;padding-right:24px;' : ''}cursor:pointer;transition:background .2s" onmouseenter="this.style.background='#F8FAFC'" onmouseleave="this.style.background='${n.unread ? 'var(--primary-light)' : 'transparent'}'">
      <div style="width:40px;height:40px;border-radius:10px;background:${n.color}15;color:${n.color};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span class="material-icons-outlined" style="font-size:20px">${n.icon}</span>
      </div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <h4 style="font-size:.9rem;font-weight:600">${n.title}${n.unread ? ' <span style="width:8px;height:8px;background:var(--primary);border-radius:50%;display:inline-block;margin-left:6px"></span>' : ''}</h4>
          <span style="font-size:.72rem;color:var(--text-light);white-space:nowrap">${n.time}</span>
        </div>
        <p style="font-size:.82rem;color:var(--text-secondary);margin-top:4px">${n.text}</p>
      </div>
    </div>
  `).join('');
}

function filterNotif(type, el) {
  document.querySelectorAll('.filter-btn').forEach(b => { b.className = 'btn btn-secondary btn-sm filter-btn'; });
  el.className = 'btn btn-primary btn-sm filter-btn active-filter';
  renderNotifs(type);
}

function markAllRead() {
  allNotifs.forEach(n => n.unread = false);
  renderNotifs('all');
}

renderNotifs('all');
</script>
</body>
</html>
